name: Apply roulette count fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-roulette-count.py'
      - 'index.html'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-roulette-count.py
      - name: Commit patched game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: roleta especial somente apos 5 voltas ao inicio'
          git push
